[project]
name = "jotelab-symbolic-engine"
version = "0.1.0"
description = "Jotelab constrained symbolic computation engine (SymPy) — SUVAT launch topic"
requires-python = ">=3.11"
dependencies = [
    # Pin SymPy: solve() root ordering and nsimplify behaviour can shift between
    # releases, and the verification harness asserts on exact values (build guide §4).
    "sympy==1.13.*",
]

[project.optional-dependencies]
# HTTP service that wraps the engine (DEVELOPMENT_PLAN §1.1). Kept optional so the
# pure engine/harness stay dependency-light; install with `.[service]` to serve.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# TestClient needs httpx; installing the dev extra runs the service tests too.
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[tool.pytest.ini_options]
# Engine/templates/harness are top-level packages at the repo root.
pythonpath = ["."]
testpaths = ["tests"]
